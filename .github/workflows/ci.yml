name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify package resources
        run: |
          for f in package.json README.md LICENSE media/icon.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
            echo "  ok $f"
          done

      - name: Package VSIX
        run: npx --yes @vscode/vsce@3.6.2 package --no-git-tag-version

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-jar-glue-vsix
          path: "*.vsix"
          retention-days: 7
