name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create draft release (recommended)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::package.json version ($PKG) != release version (${{ steps.ver.outputs.version }})"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Package VSIX
        id: pack
        run: |
          npx --yes @vscode/vsce@3.6.2 package --no-git-tag-version
          echo "vsix=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.draft }}" != "false" ]; then ARGS="$ARGS --draft"; fi
          gh release create '${{ steps.ver.outputs.tag }}' \
            --title '${{ steps.ver.outputs.tag }}' \
            --generate-notes \
            --target main \
            '${{ steps.pack.outputs.vsix }}' \
            $ARGS
